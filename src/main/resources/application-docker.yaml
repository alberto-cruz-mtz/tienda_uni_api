spring:
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    debug: false

jwt:
  secret: ${JWT_SECRET}

app:
  cookie:
    secure: false # HTTP plano en Docker dev
  cors:
    allowed-origins: ${FRONTEND_URL}
  url:
    error: ${ERROR_URL}
  mail:
    sender:
      email: ${EMAIL_SENDER:no-reply@tiendauni.com} # Default sólo para pruebas con Gmail; en prod se inyecta por env
