spring:
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    debug: false

jwt:
  secret: ${JWT_SECRET}

app:
  cookie:
    secure: false # HTTP plano en Docker dev
  cors:
    allowed-origins: ${FRONTEND_URL}
  url:
    error: ${ERROR_URL}
  mail:
    sender:
      email: ${EMAIL_SENDER:no-reply@tiendauni.com} # Default sólo para pruebas con Gmail; en prod se inyecta por env

aws:
  s3:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    access-key: ${AWS_ACCESS_KEY:your-access-key}
    secret-key: ${AWS_SECRET_KEY:your-secret-key}
    buckets:
      profile-pictures: ${AWS_S3_BUCKET_PROFILE_PICTURES:avatars}
      post-media: ${AWS_S3_BUCKET_POST_MEDIA:publication-media}
