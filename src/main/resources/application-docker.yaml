spring:
  datasource:
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

jwt:
  secret: ${JWT_SECRET}

app:
  cookie:
    secure: false # HTTP plano en Docker dev
  cors:
    allowed-origins: ${FRONTEND_URL}
  url:
    error: ${ERROR_URL}
